<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkFlow</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-volver:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }

        .btn-volver:active {
            transform: scale(0.98);
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }

        .card img {
            width: 100%;
            max-width: 280px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .card img:hover {
            transform: scale(1.05);
        }

        .title {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 🔥 LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>WorkFlow</h1>

        <div class="images">

            <div class="card">
                <img src="img/WorkFlow 2.jpeg" alt="Solicitud de Récord Académico" onclick="openImage(this.src)">
                <div class="title">Solicitud de Récord Académico</div>
            </div>

            <div class="card">
                <img src="img/WorkFlow.jpeg" alt="Inscripción de Materias" onclick="openImage(this.src)">
                <div class="title">Inscripción de Materias</div>
            </div>

        </div>
        <a href="WorkFlow.html" class="btn-volver">
            Volver
        </a>
    </div>


    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeImage()">&times;</span>
        <img id="lightbox-img">
    </div>

    <script>
        function openImage(src) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("lightbox-img").src = src;
        }

        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }

        // cerrar si hacen click fuera de la imagen
        document.getElementById("lightbox").addEventListener("click", function (e) {
            if (e.target === this) {
                closeImage();
            }
        });
    </script>

</body>

</html>
